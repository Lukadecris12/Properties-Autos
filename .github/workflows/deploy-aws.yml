name: PropertyHub CI/CD - Deploy to AWS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
  ECR_BACKEND_REPOSITORY: ${{ secrets.ECR_BACKEND_REPOSITORY || 'propertyhub-backend' }}
  ECR_FRONTEND_REPOSITORY: ${{ secrets.ECR_FRONTEND_REPOSITORY || 'propertyhub-frontend' }}

jobs:
  test:
    name: Run Unit Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Backend Dependencies & Run Pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio
          PYTHONPATH=backend pytest backend/tests -v

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Next.js Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  deploy-aws:
    name: Build & Deploy Container Images to AWS ECR
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repositories Exist in AWS
        run: |
          aws ecr describe-repositories --repository-names $ECR_BACKEND_REPOSITORY --region ${{ env.AWS_REGION }} || aws ecr create-repository --repository-name $ECR_BACKEND_REPOSITORY --region ${{ env.AWS_REGION }}
          aws ecr describe-repositories --repository-names $ECR_FRONTEND_REPOSITORY --region ${{ env.AWS_REGION }} || aws ecr create-repository --repository-name $ECR_FRONTEND_REPOSITORY --region ${{ env.AWS_REGION }}

      - name: Build, Tag, and Push Backend Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest ./backend
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest

      - name: Build, Tag, and Push Frontend Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest ./frontend
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest

      - name: Deployment Notification
        run: |
          echo "=========================================================="
          echo "PropertyHub images deployed to Amazon ECR successfully!"
          echo "Region:   ${{ env.AWS_REGION }}"
          echo "Backend:  ${{ steps.login-ecr.outputs.registry }}/$ECR_BACKEND_REPOSITORY:latest"
          echo "Frontend: ${{ steps.login-ecr.outputs.registry }}/$ECR_FRONTEND_REPOSITORY:latest"
          echo "=========================================================="

  deploy-ec2:
    name: Deploy to EC2 Production Server
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Deploy via SSH to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR || 'propertyhub' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "EC2_HOST or EC2_SSH_KEY GitHub secret is not configured. Skipping EC2 deployment."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key
          ssh -i ~/.ssh/ec2_deploy_key -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "
            set -e
            cd ~/$EC2_APP_DIR
            git pull origin main
            if [ -n \"$GEMINI_API_KEY\" ]; then
              touch .env
              grep -q '^GEMINI_API_KEY=' .env && sed -i \"s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=$GEMINI_API_KEY|\" .env || echo \"GEMINI_API_KEY=$GEMINI_API_KEY\" >> .env
              grep -q '^GEMINI_MODEL=' .env && sed -i \"s|^GEMINI_MODEL=.*|GEMINI_MODEL=$GEMINI_MODEL|\" .env || echo \"GEMINI_MODEL=$GEMINI_MODEL\" >> .env
            fi
            docker compose up -d --build --force-recreate --renew-anon-volumes
            docker image prune -f
          "
