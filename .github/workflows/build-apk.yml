name: Build Android APK (PropertyHub Mobile)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compile Release APK for Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Wrapper & Custom PropertyHub Icon
        run: |
          cp -r mobile/lib /tmp/lib_backup
          cp mobile/pubspec.yaml /tmp/pubspec_backup.yaml
          cp mobile/generate_icon.py /tmp/generate_icon.py
          cd mobile
          flutter create --org com.propertyhub.luxury.app --project-name propertyhub_mobile --platforms=android .
          rm -rf lib test
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          cp /tmp/generate_icon.py generate_icon.py
          python3 generate_icon.py

      - name: Install Flutter Dependencies & Build Release APK
        working-directory: ./mobile
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../PropertyHub.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PropertyHub-Android-APK
          path: PropertyHub.apk

      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          name: "Properties & Autos Android App v1.0.7 (Wishlist & Rebranding)"
          body: "Direct Android APK installer featuring App Rebranding to Properties & Autos, Unified 'Post Request' nomenclature, and the Saved Wishlist & Favorites System across luxury real estate and exotic automobiles."
          files: PropertyHub.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
