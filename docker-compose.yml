version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: propertyhub_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-propertyhub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-propertyhub_secure_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-propertyhub_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-propertyhub_user} -d ${POSTGRES_DB:-propertyhub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: propertyhub_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: propertyhub_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-propertyhub_user}:${POSTGRES_PASSWORD:-propertyhub_secure_pwd}@db:5432/${POSTGRES_DB:-propertyhub_db}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-propertyhub_user}:${POSTGRES_PASSWORD:-propertyhub_secure_pwd}@db:5432/${POSTGRES_DB:-propertyhub_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-propertyhub_super_secret_jwt_key_change_in_production_2026}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: propertyhub_web
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/api/v1/ws

volumes:
  postgres_data:
  redis_data:
  uploads_data:
